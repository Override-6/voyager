[project]
name = "voyager"
version = "0.1.0"
description = "Agentic CLI for a local model: chat and coding, or long-running missions in workspaces, with live streaming of thinking, text and tool calls"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx2>=2.13.0",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "prompt_toolkit>=3.0.43",
    "trafilatura>=2.2.0",
]

[project.scripts]
voyager = "voyager.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voyager"]
